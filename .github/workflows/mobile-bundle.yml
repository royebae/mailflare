name: Bundle Wuse mobile worker
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: wuse-mailflare-mobile-build
          run-id: 37737265200
          github-token: ${{ github.token }}
      - name: Bundle current Worker without deployment or migrations
        run: OPEN_NEXT_DEPLOY=true npx wrangler deploy --dry-run --outdir .worker-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: wuse-mobile-worker-bundle
          path: .worker-bundle
          include-hidden-files: true
