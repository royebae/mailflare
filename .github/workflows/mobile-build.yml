name: Build Wuse mobile interface
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build existing runtime without database migrations
        run: npx opennextjs-cloudflare build
      - name: Bundle current Worker without deployment or migrations
        run: OPEN_NEXT_DEPLOY=true npx wrangler deploy --dry-run --outdir .worker-bundle
      - name: Record TypeScript diagnostics
        run: npx tsc --noEmit > typecheck.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: wuse-mailflare-mobile-build
          path: |
            .open-next
            .worker-bundle
            typecheck.log
          include-hidden-files: true
